name: Feature request
description: Propose a useful capability or improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: motivation
    attributes:
      label: What problem would this solve?
      description: Explain the use case before implementation details.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: Describe the behavior or API you think would address the problem.
    validations:
      required: false
