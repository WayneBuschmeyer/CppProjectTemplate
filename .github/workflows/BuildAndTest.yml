name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  presets:
    name: Preset compatibility
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate schema contract
        run: cmake -P scripts/ValidatePresets.cmake

      - name: Parse every preset kind
        run: |
          cmake --list-presets
          cmake --build --list-presets
          ctest --list-presets
          cmake --workflow --list-presets

  windows:
    name: Windows / ${{ matrix.workflow }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        workflow:
          - msvc-debug
          - msvc-debug-asan
          - msvc-relwithdebinfo
          - msvc-release
          - clangcl-debug
          - clangcl-relwithdebinfo

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Windows workflow
        shell: cmd
        env:
          WORKFLOW_PRESET: ${{ matrix.workflow }}
        run: scripts\Build.cmd %WORKFLOW_PRESET%

  linux:
    name: Linux / ${{ matrix.workflow }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workflow:
          - linux-clang-sanitized
          - linux-gcc-relwithdebinfo
          - linux-gcc-release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          cmake --version
          ninja --version
          clang --version
          clang++ --version
          gcc --version
          g++ --version

      - name: Run workflow
        run: cmake --workflow --preset ${{ matrix.workflow }}

  macos:
    name: macOS / Apple Clang
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          cmake --version
          ninja --version
          clang --version
          clang++ --version

      - name: Run workflow
        run: cmake --workflow --preset macos-clang-debug

  format:
    name: Clang-Format
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check C++ formatting
        shell: bash
        run: |
          clang-format-22 --version

          mapfile -d '' files < <(
            find include src app tests \
              -type f \
              \( -name '*.h' -o -name '*.hpp' -o -name '*.cpp' -o -name '*.cxx' \) \
              -print0
          )
          if ((${#files[@]} > 0)); then
            clang-format-22 --dry-run --Werror "${files[@]}"
          fi

  clang-tidy:
    name: Clang-Tidy
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show analyzer version
        run: clang-tidy-22 --version

      - name: Run Clang-Tidy workflow
        run: cmake --workflow --preset linux-clang-tidy

  package-consumer:
    name: Installed package consumer
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test release package
        run: cmake --workflow --preset linux-gcc-release

      - name: Install package
        run: cmake --install out/build/linux-gcc-release --prefix "$RUNNER_TEMP/project-install"

      - name: Configure external consumer
        run: >
          cmake
          -S tests/consumer
          -B "$RUNNER_TEMP/consumer-build"
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/project-install"

      - name: Build external consumer
        run: cmake --build "$RUNNER_TEMP/consumer-build"

      - name: Run external consumer
        run: "$RUNNER_TEMP/consumer-build/ProjectNameConsumer"
